[package]
name = "aether-echo"
version = "0.1.0"
default-run = "aether-echo"
description = "AetherEcho - Stealthy AI Interview Assistant"
authors = ["AetherEcho"]
edition = "2021"

[lib]
name = "aether_echo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"

# HTTP client for Groq API
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "multipart"], default-features = false }

# OS Keyring (Windows Credential Manager)
keyring = { version = "3", features = ["windows-native"] }

# Audio capture — WASAPI for Windows loopback
wasapi = "0.15"
hound = "3.5"                  # WAV writing for debug
screenshots = "0.8"            # Screen capture for visual solver
base64 = "0.22"                # Base64 encoding for vision API payload
rubato = "0.15"                # Audio resampling to 16kHz

# Whisper transcription
whisper-rs = { version = "0.13", features = [] }

# Channel for audio pipeline
crossbeam-channel = "0.5"

# Unique IDs
uuid = { version = "1", features = ["v4"] }

# Error handling
thiserror = "1"

# Async streaming for model download
futures-util = "0.3"

# Logging plugin
tauri-plugin-log = "2"

# Windows API for WDA_EXCLUDEFROMCAPTURE
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[patch.crates-io]
whisper-rs-sys = { path = "local_dependencies/whisper-rs-sys" }

# ── Optimized debug builds for heavy inference crates ─────────────────────────
# Your own code stays unoptimized (fast recompile), but the math-heavy deps
# compile at opt-level=3. Makes Whisper ~5-10x faster in dev mode.
[profile.dev.package.whisper-rs]
opt-level = 3

[profile.dev.package.whisper-rs-sys]
opt-level = 3

[profile.dev.package.rubato]
opt-level = 3

[profile.dev.package.reqwest]
opt-level = 3
